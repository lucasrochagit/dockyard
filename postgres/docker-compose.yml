services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres-local
    hostname: postgres

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

    # Parametros reduzidos para uso local de teste (defaults do Postgres sao pensados
    # para servidores maiores). LISTEN/NOTIFY nao exige nenhuma configuracao extra.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=50

    mem_limit: 512m
    cpus: 1.0

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - shared_net

volumes:
  postgres_data:

networks:
  shared_net:
    external: true
