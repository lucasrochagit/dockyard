## Limite de memória (alarme em 40% da memória total)
## O RabbitMQ nao detecta o mem_limit do container: sem o override abaixo ele usa a
## RAM da VM inteira do Docker (ex.: 16 GB -> alarme em ~6.4 GB) e o container seria
## morto por OOM em 512 MB antes do alarme disparar. Mantenha igual ao mem_limit do compose.
total_memory_available_override_value = 512MiB
vm_memory_high_watermark.relative = 0.4

## Espaço mínimo livre em disco
disk_free_limit.absolute = 500MB

## Listener AMQP
listeners.tcp.default = 5672

## Management UI
management.tcp.port = 15672

## Permite login do usuário guest fora de localhost (necessário para acesso via rede docker)
loopback_users.guest = false