services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    hostname: n8n
    restart: unless-stopped

    ports:
      - "5678:5678"

    environment:
      GENERIC_TIMEZONE: America/Recife
      TZ: America/Recife

      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"

      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http

    volumes:
      - n8n_data:/home/node/.n8n

    networks:
      - shared_net

volumes:
  n8n_data:

networks:
  shared_net:
    external: true
