services:
  minio:
    image: quay.io/minio/minio
    container_name: minio_s3_simulator
    hostname: minio

    ports:
      - "9000:9000" # Porta da API (S3 Endpoint)
      - "9001:9001" # Porta do Painel Web

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin1234

    command: server /data --console-address ":9001"

    mem_limit: 512m
    cpus: 1.0

    volumes:
      - minio_data:/data

    restart: unless-stopped

    networks:
      - shared_net

volumes:
  minio_data:

networks:
  shared_net:
    external: true
